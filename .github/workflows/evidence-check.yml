name: evidence-check

# The evidence rules in README.md are only worth what is enforced. This job
# enforces the mechanically checkable ones on every change to the corpus.

on:
  push:
    branches: ["**"]
    paths: ["literature/**", "reference/**", "tools/**", ".github/workflows/evidence-check.yml"]
  pull_request:
    paths: ["literature/**", "reference/**", "tools/**", ".github/workflows/evidence-check.yml"]
  schedule:
    # Weekly, with network resolution on: catches link rot and retracted or
    # renumbered identifiers that were valid when merged.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  structural:
    name: structural checks (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check citation integrity
        run: python3 tools/check_references.py literature reference

  identifiers:
    name: identifier resolution (network)
    # Only on schedule and manual runs: it hits PubMed, doi.org and
    # ClinicalTrials.gov, so it must not run on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve every PMID, DOI and NCT number
        run: python3 tools/check_references.py literature reference --online
